spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_db_password_here}

  security:
    filter:
      dispatcher-types: request

  ai:
    openai:
      chat:
        options:
          model: deepseek-chat
      api-key: ${AI_API_KEY:your_deepseek_or_siliconflow_api_key_here}
      base-url: https://api.deepseek.com

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change_this_to_a_long_random_string_for_jwt_signing}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  token-prefix: "Bearer "

alert:
  mail:
    enabled: false
    to: admin@example.com
    from: noreply@example.com
  notify-min-level: 2
